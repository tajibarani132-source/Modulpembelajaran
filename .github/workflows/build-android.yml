# Build APK Android "Modul RPS IAIN Parepare" di GitHub Actions (Capacitor 8).
# Tidak memerlukan Android SDK/Java di komputer sendiri: semua dikerjakan di server GitHub.
#
# Cara memakai:
#   1. Push perubahan ke cabang main (folder app/ atau mobile/), atau jalankan manual:
#      tab Actions > "Build APK Android" > Run workflow.
#   2. Setelah selesai, job "release" menerbitkan APK di GitHub Releases. Tautan unduh langsung
#      (tanpa login, selalu versi terbaru):
#        https://github.com/<akun>/<repositori>/releases/latest/download/Modul-RPS-IAIN-Parepare.apk
#      APK juga tersedia sebagai artefak "modul-rps-apk" di halaman run (berisi APK debug, dan
#      APK rilis bertanda tangan bila secrets di bawah tersedia).
#
# APK rilis bertanda tangan (OPSIONAL). Tambahkan Repository secrets berikut di
# Settings > Secrets and variables > Actions > New repository secret:
#   ANDROID_KEYSTORE_BASE64    isi berkas keystore (.jks/.p12) dalam base64, mis.:
#                                Linux/macOS : base64 -w0 rilis-modulrps.jks
#                                Windows     : [Convert]::ToBase64String([IO.File]::ReadAllBytes("rilis-modulrps.jks"))
#   ANDROID_KEYSTORE_PASSWORD  kata sandi keystore
#   ANDROID_KEY_ALIAS          alias kunci di dalam keystore
#   ANDROID_KEY_PASSWORD       kata sandi kunci (alias)
# Membuat keystore (sekali saja, simpan baik-baik; kunci yang sama wajib dipakai untuk setiap pembaruan):
#   keytool -genkeypair -v -keystore rilis-modulrps.jks -alias modulrps -keyalg RSA -keysize 4096 -validity 10000
# Bila salah satu secrets kosong, langkah rilis dilewati dan hanya APK debug yang dibuat.
#
# Catatan: APK debug ditandatangani kunci debug yang dibuat sekali di runner lalu disimpan di
# cache Actions, agar APK berikutnya dapat dipasang menimpa versi lama. ANDROID_USER_HOME
# diarahkan ke ~/.android; tanpa itu AGP 8.13 menaruh kunci di ~/.config/.android (mengikuti
# XDG_CONFIG_HOME runner) sehingga cache tidak pernah tersimpan. Sidik jari kunci tampil sebagai
# anotasi di setiap run. Cache yang tidak dipakai selama 7 hari dihapus GitHub, sehingga kunci
# debug bisa berganti (pengguna harus uninstall dulu). Cache repositori publik juga dapat dibaca
# workflow pull request dari fork, jadi kunci debug bukan rahasia. Untuk dibagikan ke dosen,
# gunakan APK rilis bertanda tangan (kuncinya tersimpan di secrets dan tetap).

name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.versi.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: mobile

    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tanpa ANDROID_USER_HOME, AGP 8.13 memakai $XDG_CONFIG_HOME/.android (di runner:
      # ~/.config/.android), sehingga kunci debug yang di-cache (~/.android) tidak pernah ada.
      - name: Tetapkan folder preferensi Android (lokasi kunci debug)
        run: |
          mkdir -p "$HOME/.android"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

      # @capacitor/cli 8 mensyaratkan Node.js >= 22
      - name: Siapkan Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      # @capacitor/android 8 dikompilasi dengan Java 21 (AGP 8.13, Gradle 8.14).
      # Dipatok ke v6.2.0 karena @v6 saat ini menunjuk v6.3.0 yang belum berumur 14 hari;
      # ganti ke @v6 setelah 2026-11-28 (periksa dulu rilis yang ditunjuk).
      - name: Siapkan JDK 21 (Temurin)
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: mobile/package.json
          # Sejak v5 ~/.gradle/wrapper tidak lagi ikut cache bawaan (proyek Android baru dibuat
          # setelah langkah ini), jadi kedua folder ditulis eksplisit seperti perilaku v4.
          cache-path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          problem-matcher: false

      # Belum ada package-lock.json. Paket turunan dibatasi pada versi yang sudah terbit
      # minimal 14 hari (kebijakan keamanan rantai pasok); paket utama sudah dipatok versinya.
      - name: Pasang dependensi npm
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --before="$(date -u -d '14 days ago' +%Y-%m-%d)"
          npx cap --version

      - name: Salin aplikasi web (app/ ke mobile/www)
        run: node scripts/copy-web.js

      - name: Tambah platform Android (bila mobile/android belum ada)
        run: |
          if [ -d android ]; then
            echo "Folder mobile/android sudah ada, langkah cap add dilewati."
          else
            npx cap add android
          fi

      - name: Buat ikon dan layar pembuka Android
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sinkronkan web dan plugin ke proyek Android
        run: npx cap sync android

      - name: Atur nomor versi APK
        id: versi
        run: |
          set -euo pipefail
          BASE="$(node -p "require('./package.json').version")"
          VERSION_NAME="${BASE}.${GITHUB_RUN_NUMBER}"
          sed -i -E \
            -e "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" \
            -e "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" \
            android/app/build.gradle
          grep -nE 'applicationId|versionCode|versionName' android/app/build.gradle
          echo "APP_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Pulihkan kunci debug (agar APK debug bisa dipasang menimpa versi lama)
        id: kunci-debug
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build APK debug
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/modul-rps-${APP_VERSION}-debug.apk"
          ls -la app/build/outputs/apk/debug/

      # Hanya diagnosis: tidak pernah menggagalkan build dan tidak mencetak secrets
      # (kata sandi "android" adalah kata sandi baku kunci debug Android).
      - name: Periksa kunci debug dan sidik jari APK
        working-directory: mobile/android
        continue-on-error: true
        env:
          CACHE_HIT: ${{ steps.kunci-debug.outputs.cache-hit }}
        run: |
          set +e +o pipefail
          KS="$HOME/.android/debug.keystore"
          APK="$(ls app/build/outputs/apk/debug/*-debug.apk 2>/dev/null | head -n 1)"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          APK_SHA="$("$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          KS_SHA=""
          if [ -f "$KS" ]; then
            KS_SHA="$(keytool -list -v -keystore "$KS" -storepass android 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          else
            FOUND="$(find "$HOME" -maxdepth 4 -type f -name debug.keystore 2>/dev/null | paste -sd ' ' -)"
            echo "::warning title=Kunci debug tidak akan di-cache::$KS tidak ada (ANDROID_USER_HOME=${ANDROID_USER_HOME:-kosong}); debug.keystore ditemukan di: ${FOUND:-tidak ada}"
          fi
          if [ "$CACHE_HIT" = "true" ]; then ASAL="dipulihkan dari cache"; else ASAL="baru dibuat; disimpan ke cache di akhir job bila berkasnya ada"; fi
          if [ -z "$APK_SHA" ]; then
            echo "::warning title=Sidik jari APK debug tidak terbaca::apksigner atau berkas APK tidak ditemukan (kunci ${ASAL})"
          else
            echo "::notice title=Sidik jari APK debug::SHA-256 $APK_SHA; kunci ${ASAL}"
            if [ -n "$KS_SHA" ] && [ "$KS_SHA" != "$APK_SHA" ]; then
              echo "::warning title=APK debug tidak memakai kunci yang di-cache::keystore $KS_SHA, APK $APK_SHA"
            fi
          fi
          echo "SHA-256 penanda tangan APK debug: ${APK_SHA:-tidak terbaca} (${ASAL})" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Secrets hanya diberikan pada langkah yang membutuhkannya (tidak pada npm install).
      - name: Periksa secrets penandatanganan rilis
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Secrets penandatanganan lengkap: APK rilis akan dibuat."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets penandatanganan belum lengkap; hanya APK debug yang dibuat."
          fi

      - name: Build dan tanda tangani APK rilis
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          OUT=app/build/outputs/apk/release
          UNSIGNED="$OUT/app-release-unsigned.apk"
          SIGNED="$OUT/modul-rps-${APP_VERSION}-release.apk"
          KS_FILE="$RUNNER_TEMP/rilis-modulrps.keystore"
          trap 'rm -f "$KS_FILE" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf '%s' "$KS_B64" | base64 --decode > "$KS_FILE"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          echo "Memakai build-tools: $BT"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS_FILE" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$SIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$SIGNED"
          rm -f "$UNSIGNED"
          ls -la "$OUT"

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v7
        with:
          name: modul-rps-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Ringkasan
        if: success()
        run: |
          {
            echo "### APK Modul RPS IAIN Parepare ${APP_VERSION}"
            echo ""
            echo "Unduh artefak **modul-rps-apk** di bagian *Artifacts* pada halaman run ini."
            echo "- \`debug/\`: APK debug (untuk uji coba)"
            if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
              echo "- \`release/\`: APK rilis bertanda tangan (untuk dibagikan)"
            fi
            echo ""
            echo "Pasang di Android: buka berkas APK lalu izinkan *Instal aplikasi tidak dikenal* bila diminta."
          } >> "$GITHUB_STEP_SUMMARY"

  # Menerbitkan APK sebagai GitHub Release agar dapat diunduh langsung dari ponsel (tanpa login dan
  # tanpa zip). Tautan yang selalu mengarah ke versi terbaru:
  #   https://github.com/<akun>/<repositori>/releases/latest/download/Modul-RPS-IAIN-Parepare.apk
  # Job ini terpisah dan hanya menerima APK jadi, sehingga izin tulis tidak dipegang oleh langkah
  # yang menjalankan kode pihak ketiga (npm/Gradle) di job build.
  release:
    name: Terbitkan APK di GitHub Releases
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Ambil APK hasil build
        uses: actions/download-artifact@v8
        with:
          name: modul-rps-apk
          path: apk

      - name: Buat rilis berisi APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SIGNED="$(find apk -name '*-release.apk' | head -n 1)"
          DEBUG="$(find apk -name '*-debug.apk' | head -n 1)"
          if [ -n "$SIGNED" ]; then SRC="$SIGNED"; JENIS="rilis bertanda tangan"; else SRC="$DEBUG"; JENIS="debug"; fi
          [ -n "$SRC" ] || { echo "::error::APK tidak ditemukan pada artefak"; exit 1; }
          cp "$SRC" Modul-RPS-IAIN-Parepare.apk
          TAG="v${VERSION}"
          LINK="https://github.com/${REPO}/releases/latest/download/Modul-RPS-IAIN-Parepare.apk"
          {
            echo "Aplikasi **Modul RPS IAIN Parepare** versi ${VERSION} untuk Android (APK ${JENIS}), bekerja offline."
            echo ""
            echo "**Cara memasang:** dari ponsel, unduh \`Modul-RPS-IAIN-Parepare.apk\` di bawah, buka berkasnya, lalu izinkan *Instal aplikasi tidak dikenal* bila diminta."
            echo ""
            echo "Tautan unduh yang selalu mengarah ke versi terbaru: ${LINK}"
            if [ -z "$SIGNED" ]; then
              echo ""
              echo "_APK debug untuk uji coba. Bila pembaruan gagal dipasang karena tanda tangan berbeda, simpan proyek (.json), hapus versi lama, lalu pasang ulang._"
            fi
          } > catatan-rilis.md
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" Modul-RPS-IAIN-Parepare.apk --repo "$REPO" --clobber
          else
            gh release create "$TAG" Modul-RPS-IAIN-Parepare.apk --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Modul RPS IAIN Parepare ${VERSION}" --notes-file catatan-rilis.md --latest
          fi
          {
            echo "### Unduh APK langsung"
            echo "${LINK}"
          } >> "$GITHUB_STEP_SUMMARY"
