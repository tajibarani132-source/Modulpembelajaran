# Terbitkan versi online (folder app/) ke GitHub Pages.
#
# Persiapan sekali saja: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Setelah itu setiap push ke main yang mengubah app/ akan memperbarui situs, atau jalankan
# manual: tab Actions > "Deploy GitHub Pages" > Run workflow.
# Alamat situs: https://<akun>.github.io/<nama-repo>/ (ditampilkan pada hasil run).
# Situs dilayani lewat HTTPS, sehingga mode offline (PWA / service worker sw.js) aktif.

name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu penerbitan berjalan bersamaan; penerbitan yang sedang berjalan tidak dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Terbitkan ke GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah folder app sebagai artefak Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
